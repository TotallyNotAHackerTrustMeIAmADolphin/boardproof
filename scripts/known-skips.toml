# Skips the batch gate allows (build ticket 45; playbook fork P11). Any other skip turns it RED.
# Each [[skip]]: `file` is the test file (posix path), `reason` a prefix of pytest's skip reason,
# `max` the most skips allowed with that file and reason, `why` the reason it is acceptable.
# Adding an entry or raising a max needs its own ticket and a review, like a known-red entry.
