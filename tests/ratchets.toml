# Calls of the fault helper's writers (write_unchecked, raw_atom, rewrite_bytes) outside
# tests/_kicad_faults.py and tests/test_kicad_faults.py (KicadFaultCallScanner, review round 1).
# Each writes a KiCad file KiCad would not write, so each call is listed by its text (code) with
# a note saying which fault the test needs. 11 calls on 2026-10-21. A new call needs a
# reviewed entry; drift() is not listed (its bytes change, its tokens do not).
# The key is the call's text only: the body of a named change function it passes
# (_with_eol, _insert_one_byte, _same_size_other_content) is not keyed; review it with the call.
# A bare reference is a site too (w = rb, functools.partial(rb, p)); calls through w are not
# listed again. Any other reference through the helper fails FaultHelperUseScanner.
# --------------------------------------------------------------------------------------------

