# Frozen lists for tests/test_ratchets.py (build ticket 29; docs/ARCHITECTURE.md decision 4).
#
# Frozen 2026-10-19 on main at 34a429b (src/ unchanged since ticket 07's audit at 045ffc9).
# Keys are file (relative to src/kicad_mcp) + function (dotted, without <locals>) + kind. Raw
# writes and high-level saves also key on code, the call's exact normalised text (ast.unparse),
# so retargeting a listed call (open(log) -> open(board)) fails as new + stale; the other lists
# carry a count. Never line numbers. Code strings are TOML literal strings (triple single quotes).
#
# These lists only shrink. A site that is gone, or a count that fell, fails the test until the
# entry is lowered or deleted here. A new site fails until it is fixed, or until it is added
# here with a note in the same change, for the reviewer: adding an entry is a claim that the
# site was looked at, not a way to make the test pass.

