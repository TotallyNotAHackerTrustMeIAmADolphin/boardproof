read_only_reach = "The layer writes only a temporary sibling of the path its caller names, and replaces only that path. Read-only tools reach it only through saves of their own trial copies inside a TemporaryDirectory (propose_placement_optimization, propose_route_with_retry via _apply_specs), never the caller's board."

