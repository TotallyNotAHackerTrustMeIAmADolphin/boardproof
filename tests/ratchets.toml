# ============================================================================================
# BUILD TICKET 74 BLOCK: raw writes of KiCad files in tests/ (test_kicad_write). Kept together
# at the end of the file so concurrent tickets that add entries above do not interleave with it.
#
# CLAUDE.md hard rule 1 holds in tests: a KiCad variant is built through the write layer (load,
# typed setters, save), a deliberate fault through tests/_kicad_faults.py. The scan
# (KicadTestWriteScanner) flags a raw write in tests/ when its target names a KiCad file (pcb,
# sch, board, sheet, fp, mod, sym, dru, pro, prl, wks, table, a .kicad_* suffix) or its payload
# is KiCad text (starts with "(kicad_", "(footprint", "(fp_lib_table", "(version", ...) or comes
# from a serialiser or a read of a KiCad-named path; names are resolved up to two hops through
# the enclosing functions' assignments, parametrize values and module constants (review round
# 1). Every raw write in _kicad_faults.py counts. Blind spots are named in the scanner's
# docstring: a path reached through a function argument or a call's result, a suffix built at
# run time, Path.write_text(p, t), an aliased method, a temporary file moved onto a .kicad_*
# file, plural directory names, print(file=fh), fh.write(text) on a handle of a generic name.
#
# Keys are file (relative to tests/) + function + kind, with a count; never line numbers. Each
# entry has a use and a note:
#   fault       a deliberate fault (drift, garbage, truncation); only _kicad_faults.py should
#               keep these, the others are debt to move there
#   fixture     a KiCad file written as hand-made text; debt to build through the write layer,
#               or text the layer cannot save (.kicad_dru and library tables have no kind)
#   serialised  built with an object model, written with a serialiser but no parse check
#   stub        a file whose content is never parsed as KiCad (a fingerprint input, a faked
#               subprocess's input, a marker the test compares byte for byte)
#   copy        a KiCad-written file's text copied under a new name
# Frozen 2026-10-20 on ticket-74 (main 3633af3, merged with 6b0bcfd): 76 entries, 91 sites.
# Round 1, 2026-10-21 (merged with main f7c8ca1): 78 entries, 93 sites. Only shrinks.
# ============================================================================================

