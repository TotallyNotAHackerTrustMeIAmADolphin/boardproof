[writing_tool.move_text]
self_check = "reload-verify"
note = "Issue 198: text_edit.move_text changes the (at) of the selected texts and text boxes on a copy of the sheet's tree in memory (typed atoms), checks that every node it did not select is unchanged (staged check), compares kicad-cli's netlist of the project before and after on scratch copies (connectivity_changed, no override) and its ERC census (write_not_verified, check erc_unchanged), and only then saves through write_layer.save, whose verify reloads the temporary sibling and compares it with the serialised tree before os.replace."
proof = [
    "tests/test_text_edit.py::test_move_text_corrupted_write_is_refused_and_leaves_the_sheet_alone",
    "tests/test_text_edit.py::test_move_text_staged_check_fires_when_a_move_also_moves_something_else",
    "tests/test_text_edit.py::test_move_text_erc_check_fires_when_the_census_moves",
]
