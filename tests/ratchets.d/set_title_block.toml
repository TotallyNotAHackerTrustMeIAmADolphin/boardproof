[writing_tool.set_title_block]
self_check = "reload-verify"
note = "Issue 97: title_block.set_title_block changes only the title_block node of each named sheet on a copy of the sheet's tree in memory (typed atoms; a line break is stored as the escape KiCad itself writes), checks that every other node is unchanged and the title block holds exactly the asked fields (staged check), compares kicad-cli's netlist of the project on scratch copies (the staged netlist must show the asked text per edited sheet, and the same nets as before) and its ERC violation counts before and after, and only then saves each sheet through write_layer.save, whose verify reloads the temporary sibling and compares it with the serialised tree before os.replace; a failed later write restores the sheets already written."
proof = [
    "tests/test_set_title_block.py::test_a_corrupted_write_is_refused_and_leaves_the_sheet_alone",
    "tests/test_set_title_block.py::test_the_staged_check_fires_when_the_edit_touches_more_than_the_title_block",
]
